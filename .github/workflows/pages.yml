# Publica la aplicación en GitHub Pages.
#
# No hay compilación: se copian los ficheros que el navegador necesita
# (index.html, pelis.html y src/) y se suben tal cual.
#
# PASO ÚNICO ANTES DEL PRIMER DESPLIEGUE: en Settings -> Pages, poner Source en
# "GitHub Actions". El token del flujo puede publicar, pero no puede crear el
# sitio de Pages ("Resource not accessible by integration"): eso lo tiene que
# habilitar una vez el dueño del repositorio. Después, cada push despliega solo.
name: Publicar en GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - claude/pelis-sin-anuncios-plataforma-no4tnb
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez, sin cancelar el que ya esté en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

      # pelis.html se genera desde src/: si alguien tocó el código y no lo
      # regeneró, el fichero único quedaría desactualizado sin que se note.
      - name: Comprobar que pelis.html está al día
        run: |
          npm run build
          git diff --exit-code pelis.html \
            || { echo '::error::pelis.html está desactualizado; ejecutá npm run build'; exit 1; }

  deploy:
    name: Desplegar
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # `enablement` intenta activar Pages solo; si el token no tiene permiso,
      # falla aquí y hay que activarlo a mano una vez (ver cabecera).
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar el sitio
        run: |
          npm run build
          mkdir -p dist
          cp index.html pelis.html dist/
          cp -r src dist/
          # Sin esto, Pages pasaría los ficheros por Jekyll.
          touch dist/.nojekyll

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
